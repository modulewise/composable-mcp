[package]
name = "composable-tools"
version.workspace = true
edition.workspace = true

[workspace]
members = ["crates/cli", "crates/mcp-server"]
resolver = "3"

[workspace.package]
version = "0.5.0-alpha.5"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
composable-runtime = { git = "https://github.com/modulewise/composable-runtime", branch = "main", default-features = false }
serde_json = "1"

[dependencies]
anyhow.workspace = true
composable-runtime.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
