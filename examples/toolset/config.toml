# The toolset, including a local tool and a remote toolset.
[toolset.toolset]
tools = ["greeter"]
toolsets = ["calculator"]

# A local tool: a function of the hello component.
[tool.greeter]
target = "hello"
description = "Greets someone by name"
spec-version = "2026-07-28"

[component.hello]
uri = "oci://ghcr.io/modulewise/demo/hello:0.2.0"

# A remote toolset: 4 calculator tools from an MCP server.
[mcp-toolset.calculator]
server-url = "http://localhost:3001/mcp"
