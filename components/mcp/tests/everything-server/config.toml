[component.mcp-client]
uri = "../../../lib/mcp-client.wasm"
imports = ["http-client", "logger"]

[component.http-client]
uri = "oci://ghcr.io/modulewise/component/http-client:0.4.0"
imports = ["http"]

[component.logger]
uri = "oci://ghcr.io/componentized/logging/to-stdout:0.3.0"
imports = ["stdout-to-stderr", "cli", "clocks"]

[component.stdout-to-stderr]
uri = "oci://ghcr.io/componentized/cli/stdout-to-stderr:0.2.0"
imports = ["cli"]

[capability.http]
type = "wasi:http"

[capability.clocks]
type = "wasi:clocks"

[capability.cli]
type = "wasi:cli"
inherit-stderr = true
