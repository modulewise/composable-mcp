# Tests the `mcp-tool` and `mcp-tool` components against the MCP reference
# `server-everything` on port 3002 (started by `test.sh`).

[component.everything]
uri = "../../../lib/mcp-toolset.wasm"
imports = ["mcp-client"]
config.server-url = "http://localhost:3002/mcp"

[component.echo]
uri = "../../../lib/mcp-tool.wasm"
imports = ["mcp-client"]
config.server-url = "http://localhost:3002/mcp"
config.tool-name = "echo"

